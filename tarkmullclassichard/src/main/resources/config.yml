# ====== HardMode config ======

# HP и урон для обычных враждебных мобов
mob-health-multiplier: 2.0
mob-damage-multiplier: 2.0
# Скелет (не пещерный отравитель, а обычный лучник) — отдельный множитель
# урона, заменяет общий mob-damage-multiplier (действует и на ближний бой,
# и на урон от стрел)
skeleton-damage-multiplier: 1.8

# Криперы — отдельно: HP, урон от взрыва и радиус кратера
creeper-health-multiplier: 1.5
creeper-damage-multiplier: 1.5
creeper-explosion-radius-multiplier: 1.2
# Точное число тиков фитиля (20 тиков = 1 сек). Ванильный фитиль — 30 тиков (1.5 сек)
creeper-fuse-ticks: 20
# Отдельный множитель скорости для крипера, заменяет общий mob-speed-multiplier
creeper-speed-multiplier: 1.2

# Боссы (Дракон Края, Иссушитель, Варден) — жёстче, чем обычные мобы.
# Урон намеренно НЕ x2.5 (как обычные мобы) — на ×2.5 боссы бы убивали игрока
# в геле с одного-двух попаданий даже в броне. Вместо голого урона усилены
# "зрелищность" и частота спецатак — см. ниже.
boss-health-multiplier: 3.0
boss-damage-multiplier: 1.6

# Дополнительные снаряды у боссов (не влияют на прямой урон, увеличивают частоту атак)
# Шанс, что Иссушитель выпустит ещё один череп впридачу к обычному
wither-extra-skull-chance: 0.35
# Шанс, что Дракон Края выпустит ещё один заряд кислоты (файербол) при "тике" ниже
dragon-extra-fireball-chance: 0.5
# Шанс, что при срабатывании выше дракон плюнет сразу ДВУМЯ зарядами веером
dragon-double-fireball-chance: 0.25
# Как часто (в тиках, 20 тиков = 1 сек) проверять, не выпустить ли дракону доп. заряд
dragon-breath-interval-ticks: 80

# Скорость передвижения и дальность преследования/обнаружения у враждебных мобов
mob-speed-multiplier: 1.3
mob-follow-range-multiplier: 1.8

# Сопротивление отдаче (0.0 - 1.0). Чем выше значение, тем меньше моба
# отбрасывает при ударе игроком ("низкая отдача")
mob-knockback-resistance: 0.6

# Во сколько раз быстрее теряется прочность предметов (инструменты/броня) у игроков
durability-loss-multiplier: 2.0

# Шанс, что обычный пиглин заспавнится в полном комплекте золотой брони (0.0 - 1.0)
piglin-armor-chance: 1.0

# ====== Бэби-зомби: жокеи на курицах ======
# Шанс, что малыш, ещё не заспавнившийся жокеем сам (ванильный шанс ~5%),
# всё равно получит курицу — превращая часть "обычных" малышей в жокеев,
# без увеличения общего числа мобов
baby-zombie-jockey-chance: 0.4

# ====== Пиглины: торговля (бартер за золото) ======
# Шанс, что обмен пройдёт впустую (игрок ничего не получит)
piglin-barter-fail-chance: 0.3
# Множитель количества предметов при успешном обмене
piglin-barter-amount-multiplier: 0.6

# ====== Лут в "подземельных" структурах ======
# Trial Chambers, Ancient City, End City, бастион, Nether Fortress, Woodland
# Mansion, храмы, кораблекрушения, руины, закопанные сокровища. Не затрагивает
# вейлты (Vault) — см. комментарий в StructureLootNerfListener.java
structure-loot-fail-chance: 0.25
structure-loot-amount-multiplier: 0.6

# ====== Шалкер ======
# Во сколько раз дольше действует "Левитация" от снаряда шалкера
shulker-levitation-multiplier: 1.7

# ====== Ифрит: горение ======
# Во сколько раз дольше горит цель, подожжённая ифритом (в ближнем бою или файерболом)
blaze-fire-duration-multiplier: 1.8

# ====== Пиглины: атака вне зависимости от золотой брони игрока ======
# УБРАНО: пиглин не атакует игрока в золотой броне — это часть закрытого AI
# (проверка "видит ли пиглин золото на игроке" происходит внутри NMS и
# публичного API на неё нет). Пробовал принудительно назначать игрока целью
# через Mob#setTarget() раз в секунду — не сработало надёжно, потому что
# внутренний AI пиглина, скорее всего, сам перепроверяет и сбрасывает цель
# гораздо чаще (почти каждый тик), откатывая назначенную цель раньше, чем
# голем успевал бы атаковать. "Спрятать" золото от восприятия пиглина тоже
# нельзя — это не то, что раскрывает публичный API. Фича удалена как нерабочая.
piglin-speed-multiplier: 1.2

# ====== Фантомы: спавн каждую ночь ======
# В ваниле фантомы требуют 3+ дня без сна. Здесь — шанс на спавн у игрока каждую ночь.
phantom-every-night-enabled: true
phantom-every-night-chance: 0.7
phantom-every-night-min: 1
phantom-every-night-max: 2

# ====== Варден ======
# Во сколько раз дольше действует "Тьма" от рёва Вардена
warden-roar-darkness-multiplier: 1.6

# ====== Урон от падения ======
fall-damage-multiplier: 1.8

# ====== Голод и природная регенерация игрока ======
# Множитель силы природной регенерации (от сытости). 0.5 = лечит в 2 раза слабее
natural-regen-multiplier: 0.5
# Множитель скорости потери голода
hunger-loss-multiplier: 1.3

# ====== Заряженные криперы в грозу ======
# Шанс, что крипер заспавнится уже заряженным, если идёт гроза
storm-charged-creeper-chance: 0.25

# ====== Рейды иллагеров ======
# Доп. множитель HP/урона ТОЛЬКО для мобов, заспавненных рейдом (стакается с mob-*-multiplier)
raid-mob-extra-multiplier: 2.5

# ====== Ведьмы ======
# Во сколько раз дольше действуют зелья, которые ведьма кинула в игрока
witch-potion-duration-multiplier: 1.5
# Во сколько раз больше урона от Зелья Урона, брошенного ведьмой
witch-harming-damage-multiplier: 1.5

# ====== Скелеты-снайперы ======
# Шанс, что выстрел скелета полетит точно в цель вместо ванильного разброса
skeleton-snipe-chance: 0.85

# ====== Эндермены ======
# Шанс телепортироваться при получении урона
enderman-teleport-on-hit-chance: 0.7

# ====== Стражи ======
# Во сколько раз усиливается "Усталость горняка" от старейшего стража
guardian-fatigue-multiplier: 1.5

# ====== Зачарованное снаряжение у мобов ======
# Шанс, что скелет/зомби заспавнится с зачарованным (Sharpness/Power I) оружием.
# Специально низкий — урон мобов и так уже увеличен
mob-enchanted-gear-chance: 0.08

# ====== Силверфиши ======
# Доп. множитель скорости СВЕРХ общего mob-speed-multiplier
silverfish-extra-speed-multiplier: 1.3

# ====== Бэби-зомби ======
# Доп. множитель скорости СВЕРХ общего mob-speed-multiplier (они и так быстрее
# взрослых зомби в ваниле — это добавляется ещё сверху)
baby-zombie-extra-speed-multiplier: 1.3

# ====== Эндер-жемчуг ======
# Доп. шанс заспавнить эндермита в точке приземления, НЕЗАВИСИМЫЙ от
# ванильного ~5% шанса (публично проверить срабатывание ванильного нельзя)
enderpearl-extra-endermite-chance: 0.15

# ====== Бой с Драконом Края ======
# Во сколько раз сильнее бьёт взрыв кристалла Края по игроку рядом
crystal-explosion-damage-multiplier: 1.6
# Во сколько раз шире становится кислотная лужа от плевка дракона
dragon-acid-radius-multiplier: 1.5
# Во сколько раз дольше держится кислотная лужа от плевка дракона
dragon-acid-duration-multiplier: 1.5

# ====== Зомби: ломка дверей ======
# Ванильные зомби ломают двери только на сложности Hard и очень медленно.
# Тут независимый механизм, который работает на любой сложности сервера
zombie-door-break-enabled: true
# Сколько тиков "прогресса" нужно набрать, чтобы дверь сломалась (60 = 3 сек)
zombie-door-break-ticks: 60
# Как часто (в тиках) проверять зомби у дверей
zombie-door-break-check-period-ticks: 10

# ====== Эндермен: мгновенный телепорт при агро ======
enderman-instant-teleport-on-aggro: true
# Радиус, в котором эндермен ищет свободное место рядом с игроком для телепорта
enderman-instant-teleport-radius: 2
# Кулдаун между принудительными телепортами одного и того же эндермена (мс)
enderman-instant-teleport-cooldown-ms: 1000

# ====== Иссушитель ======
# Шанс, что при срабатывании wither-extra-skull-chance выше он кинет сразу
# ДВА дополнительных черепа веером вместо одного
wither-double-skull-chance: 0.25

# ====== Дракон Края ======
# Во сколько раз быстрее дракон лечится от кристаллов Края, если их не снести
dragon-crystal-heal-multiplier: 2.0

# ====== Пиглины-громилы (Piglin Brute) ======
# Шанс заспавнить ещё одного громилу рядом, когда громила спавнится из спаунера бастиона
piglin-brute-extra-chance: 0.4

# ====== Хоглины ======
# Во сколько раз увеличивается дальность обнаружения/погони у хоглина
hoglin-follow-range-multiplier: 2.0

# ====== Ревагеры ======
# Насколько сильнее отбрасывает игрока, который заблокировал удар щитом
ravager-shield-knockback-multiplier: 1.8
# Доп. очков прочности, которые теряет щит при блоке удара Ревагера
ravager-shield-extra-damage: 3

# ====== Ифриты (Blaze) ======
# Ванильную очередь из 2-3 файерболов не трогаем — она уже есть. Это отдельный
# шанс дополнительного одиночного выстрела в паузе между обычными атаками.
blaze-extra-shot-chance: 0.4
# Как часто (в тиках, 20 тиков = 1 сек) проверять этот доп. выстрел
blaze-extra-shot-interval-ticks: 40

# ====== Sculk Shrieker ======
# "Тьма" появляется только от Вардена (рёв) или от шрайкера. Если Вардена
# рядом нет — считаем, что сработал шрайкер, и добавляем свой шанс призвать
# Вардена сверху ванильного (у самого шрайкера он довольно низкий)
shrieker-extra-warden-chance: 0.3

# ====== Мирные мобы (коровы, овцы, свиньи, курицы и т.п.) ======
# Хоглины сюда не входят — они уже отдельно усилены как нейтральный моб
passive-mob-health-multiplier: 2.0
passive-mob-speed-multiplier: 1.15

# ====== Печи ======
# Во сколько раз медленнее готовят все виды печей (обычная, доменная, коптильня)
furnace-slowdown-multiplier: 1.8

# ====== Пауки ======
# Шанс, что обычный паук (не пещерный — у него яд уже есть в ваниле) отравит при укусе
spider-poison-chance: 0.4
spider-poison-duration-ticks: 100
spider-poison-amplifier: 0
# Скорость паука — только общий mob-speed-multiplier (×1.3), без доп. множителя

# ====== Пчёлы ======
# Пчёлы жалят без потери жала — не умирают через время после единственного укуса
bee-keep-stinger: true

# ====== Железный голем ======
iron-golem-health-multiplier: 2.0
# УБРАНО: "дальность удара" — публичного атрибута для этого у мобов нет,
# а рабочего обходного пути тоже не нашлось. Осталась только прибавка к HP.

# ====== Горение ======
# Множитель длительности горения от ЛЮБОГО источника (лава, огонь, костёр и т.п.),
# кроме поджога ифритом — у него свой отдельный blaze-fire-duration-multiplier
fire-duration-multiplier: 1.5

# ====== Урон от окружения ======
freeze-damage-multiplier: 1.5
magma-damage-multiplier: 1.5

# ====== Витер-скелет ======
# Во сколько раз усиливается эффект "Иссушение" от его удара (длительность
# ×множитель, плюс +1 уровень эффекта)
wither-skeleton-effect-multiplier: 1.7

# ====== Слаймы/магма-кубы ======
# Сколько ДОПОЛНИТЕЛЬНЫХ осколков появляется при делении сверх ванильного количества
slime-split-extra-count: 2

# ====== Зомби-житель: лечение ======
# Во сколько раз дольше длится конверсия обратно в жителя
zombie-villager-cure-time-multiplier: 1.8

# ====== Кактус / колючий куст ======
contact-damage-multiplier: 1.5

# ====== Вихрь (Breeze) ======
# Во сколько раз сильнее отталкивает удар/заряд ветра
breeze-knockback-multiplier: 1.6
# Шанс на доп. заряд ветра между обычными атаками
breeze-extra-shot-chance: 0.4
# Как часто (в тиках) проверять доп. заряд
breeze-extra-shot-interval-ticks: 40

# ====== Патрули пиллагеров ======
# Частоту самих патрулей контролировать нельзя (внутренняя проверка движка),
# только их размер: небольшой шанс доп. пиллагера, когда патруль уже спавнится
pillager-patrol-extra-chance: 0.15

# ====== Иворкер ======
# Во сколько раз дольше живут вексы (только если у конкретного векса вообще
# ограничена жизнь — vex.hasLimitedLife())
vex-life-multiplier: 1.6
# Шанс доп. векса при призыве заклинанием
evoker-extra-vex-chance: 0.5
# Шанс, что атака шипами станет шире (доп. шипы по бокам от линии атаки)
evoker-fang-widen-chance: 0.5
# Насколько далеко в стороны ставятся доп. шипы (в блоках)
evoker-fang-widen-offset: 1.0

# ====== Скелет: бонусный выстрел ======
skeleton-extra-shot-chance: 0.1
skeleton-extra-shot-interval-ticks: 40

# ====== Рыбалка ======
# Шанс, что пойманное "сокровище" (заколдованная книга/бирка/раковина
# наутилуса/сёдло — они гарантированно не бывают рыбой/мусором в ваниле)
# подменится на случайный мусорный предмет
fishing-treasure-downgrade-chance: 0.5

# ====== Композтер ======
# Шанс откатить уровень композтера обратно на 1 после успешного повышения —
# по факту требует больше отходов на тот же результат
composter-revert-chance: 0.35

# ====== Ancient City: TNT-ловушки ======
ancient-city-tnt-multiplier: 1.5

# ====== Критический удар игрока ======
# Множитель урона при вероятном крите (см. оговорку в CriticalHitListener.java
# про эвристическое определение). 0.9 = на 10% слабее ванильного бонуса
critical-hit-reduction-multiplier: 0.9

# ====== Опыт ======
# Множитель получаемого опыта. 0.7 = на 30% меньше опыта за то же действие —
# эффективно требует больше опыта для того же уровня/зачарования
experience-gain-multiplier: 0.7

# ====== Скорость случайных тиков (рост урожая и т.п.) ======
random-tick-speed-enabled: true
# Ванильное значение по умолчанию — 3. 2 = рост примерно в 1.5 раза медленнее
random-tick-speed-value: 2

# ====== Наковальня ======
# Множитель стоимости операций в уровнях опыта
anvil-cost-multiplier: 1.5

# ====== Молоко ======
# Молоко не снимает негативные эффекты полностью, а сокращает их длительность
milk-partial-cure-enabled: true
milk-remaining-duration-multiplier: 0.5

# ====== Голодание ======
starvation-damage-multiplier: 1.5
