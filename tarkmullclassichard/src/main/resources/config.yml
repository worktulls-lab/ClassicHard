# ====== HardMode config ======

# HP и урон для обычных враждебных мобов
mob-health-multiplier: 2.0
mob-damage-multiplier: 2.0

# Криперы — отдельно: HP, урон от взрыва и радиус кратера
creeper-health-multiplier: 1.5
creeper-damage-multiplier: 1.5
creeper-explosion-radius-multiplier: 1.2
# Точное число тиков фитиля (20 тиков = 1 сек). Ванильный фитиль — 30 тиков (1.5 сек)
creeper-fuse-ticks: 20

# Боссы (Дракон Края, Иссушитель, Варден) — жёстче, чем обычные мобы.
# Урон намеренно НЕ x2.5 (как обычные мобы) — на ×2.5 боссы бы убивали игрока
# в геле с одного-двух попаданий даже в броне. Вместо голого урона усилены
# "зрелищность" и частота спецатак — см. ниже.
boss-health-multiplier: 3.0
boss-damage-multiplier: 1.6

# Дополнительные снаряды у боссов (не влияют на прямой урон, увеличивают частоту атак)
# Шанс, что Иссушитель выпустит ещё один череп впридачу к обычному
wither-extra-skull-chance: 0.35
# Шанс, что Дракон Края выпустит ещё один заряд кислоты (файербол) при "тике" ниже
dragon-extra-fireball-chance: 0.5
# Шанс, что при срабатывании выше дракон плюнет сразу ДВУМЯ зарядами веером
dragon-double-fireball-chance: 0.25
# Как часто (в тиках, 20 тиков = 1 сек) проверять, не выпустить ли дракону доп. заряд
dragon-breath-interval-ticks: 80

# Скорость передвижения и дальность преследования/обнаружения у враждебных мобов
mob-speed-multiplier: 1.3
mob-follow-range-multiplier: 1.8

# Сопротивление отдаче (0.0 - 1.0). Чем выше значение, тем меньше моба
# отбрасывает при ударе игроком ("низкая отдача")
mob-knockback-resistance: 0.6

# Во сколько раз быстрее теряется прочность предметов (инструменты/броня) у игроков
durability-loss-multiplier: 2.0

# Шанс, что обычный пиглин заспавнится в полном комплекте золотой брони (0.0 - 1.0)
piglin-armor-chance: 1.0

# ====== Пиглины: атака вне зависимости от золотой брони игрока ======
# В ваниле пиглин игнорирует игрока в золоте — это отключает данную защиту
piglin-ignore-gold-armor: true
piglin-aggro-radius: 16.0
# Отдельный множитель скорости для обычных пиглинов (не громил), заменяет
# общий mob-speed-multiplier
piglin-speed-multiplier: 1.2

# ====== Фантомы: спавн каждую ночь ======
# В ваниле фантомы требуют 3+ дня без сна. Здесь — шанс на спавн у игрока каждую ночь.
phantom-every-night-enabled: true
phantom-every-night-chance: 0.7
phantom-every-night-min: 1
phantom-every-night-max: 2

# ====== Варден ======
# Во сколько раз дольше действует "Тьма" от рёва Вардена
warden-roar-darkness-multiplier: 1.6

# ====== Урон от падения ======
fall-damage-multiplier: 1.5

# ====== Голод и природная регенерация игрока ======
# Множитель силы природной регенерации (от сытости). 0.5 = лечит в 2 раза слабее
natural-regen-multiplier: 0.5
# Множитель скорости потери голода
hunger-loss-multiplier: 1.3

# ====== Заряженные криперы в грозу ======
# Шанс, что крипер заспавнится уже заряженным, если идёт гроза
storm-charged-creeper-chance: 0.25

# ====== Рейды иллагеров ======
# Доп. множитель HP/урона ТОЛЬКО для мобов, заспавненных рейдом (стакается с mob-*-multiplier)
raid-mob-extra-multiplier: 2.5

# ====== Ведьмы ======
# Во сколько раз дольше действуют зелья, которые ведьма кинула в игрока
witch-potion-duration-multiplier: 1.5
# Во сколько раз больше урона от Зелья Урона, брошенного ведьмой
witch-harming-damage-multiplier: 1.5

# ====== Скелеты-снайперы ======
# Шанс, что выстрел скелета полетит точно в цель вместо ванильного разброса
skeleton-snipe-chance: 0.85

# ====== Эндермены ======
# Шанс телепортироваться при получении урона
enderman-teleport-on-hit-chance: 0.7

# ====== Стражи ======
# Во сколько раз усиливается "Усталость горняка" от старейшего стража
guardian-fatigue-multiplier: 1.5

# ====== Зачарованное снаряжение у мобов ======
# Шанс, что скелет/зомби заспавнится с зачарованным (Sharpness/Power I) оружием.
# Специально низкий — урон мобов и так уже увеличен
mob-enchanted-gear-chance: 0.08

# ====== Силверфиши ======
# Доп. множитель скорости СВЕРХ общего mob-speed-multiplier
silverfish-extra-speed-multiplier: 1.3

# ====== Бэби-зомби ======
# Доп. множитель скорости СВЕРХ общего mob-speed-multiplier (они и так быстрее
# взрослых зомби в ваниле — это добавляется ещё сверху)
baby-zombie-extra-speed-multiplier: 1.3

# ====== Эндер-жемчуг ======
# Доп. шанс заспавнить эндермита в точке приземления, НЕЗАВИСИМЫЙ от
# ванильного ~5% шанса (публично проверить срабатывание ванильного нельзя)
enderpearl-extra-endermite-chance: 0.15

# ====== Бой с Драконом Края ======
# Во сколько раз сильнее бьёт взрыв кристалла Края по игроку рядом
crystal-explosion-damage-multiplier: 1.6
# Во сколько раз шире становится кислотная лужа от плевка дракона
dragon-acid-radius-multiplier: 1.5
# Во сколько раз дольше держится кислотная лужа от плевка дракона
dragon-acid-duration-multiplier: 1.5

# ====== Дефицит руды ======
# ВАЖНО: работает только для НОВЫХ (ещё не сгенерированных) чанков. Уже
# существующие на диске чанки (например, спавн на старом мире) не трогает —
# это не ретроактивная фича. Проверяйте на новом мире или в неисследованной местности.
ore-scarcity-enabled: true
# Шанс, что конкретный блок руды при генерации нового чанка превратится
# обратно в камень/делеслейт/незеррак. 0.4 = руды примерно на 40% меньше
ore-scarcity-chance: 0.4
# Включить лог в консоль сервера при генерации каждого нового чанка с рудой —
# покажет, сколько блоков руды было и сколько из них убрано. Полезно, чтобы
# убедиться, что фича реально работает. По умолчанию выключено (спамит лог)
ore-scarcity-debug-log: false

# ====== Иссушитель ======
# Шанс, что при срабатывании wither-extra-skull-chance выше он кинет сразу
# ДВА дополнительных черепа веером вместо одного
wither-double-skull-chance: 0.25

# ====== Дракон Края ======
# Во сколько раз быстрее дракон лечится от кристаллов Края, если их не снести
dragon-crystal-heal-multiplier: 2.0

# ====== Пиглины-громилы (Piglin Brute) ======
# Шанс заспавнить ещё одного громилу рядом, когда громила спавнится из спаунера бастиона
piglin-brute-extra-chance: 0.4

# ====== Хоглины ======
# Во сколько раз увеличивается дальность обнаружения/погони у хоглина
hoglin-follow-range-multiplier: 2.0

# ====== Ревагеры ======
# Насколько сильнее отбрасывает игрока, который заблокировал удар щитом
ravager-shield-knockback-multiplier: 1.8
# Доп. очков прочности, которые теряет щит при блоке удара Ревагера
ravager-shield-extra-damage: 3

# ====== Ифриты (Blaze) ======
# Ванильную очередь из 2-3 файерболов не трогаем — она уже есть. Это отдельный
# шанс дополнительного одиночного выстрела в паузе между обычными атаками.
blaze-extra-shot-chance: 0.4
# Как часто (в тиках, 20 тиков = 1 сек) проверять этот доп. выстрел
blaze-extra-shot-interval-ticks: 40

# ====== Sculk Shrieker ======
# "Тьма" появляется только от Вардена (рёв) или от шрайкера. Если Вардена
# рядом нет — считаем, что сработал шрайкер, и добавляем свой шанс призвать
# Вардена сверху ванильного (у самого шрайкера он довольно низкий)
shrieker-extra-warden-chance: 0.15

# ====== Мирные мобы (коровы, овцы, свиньи, курицы и т.п.) ======
# Хоглины сюда не входят — они уже отдельно усилены как нейтральный моб
passive-mob-health-multiplier: 2.0
passive-mob-speed-multiplier: 1.15

# ====== Печи ======
# Во сколько раз медленнее готовят все виды печей (обычная, доменная, коптильня)
furnace-slowdown-multiplier: 1.5

# ====== Пауки ======
# Шанс, что обычный паук (не пещерный — у него яд уже есть в ваниле) отравит при укусе
spider-poison-chance: 0.4
spider-poison-duration-ticks: 100
spider-poison-amplifier: 0
# Доп. множитель скорости СВЕРХ общего mob-speed-multiplier
# (действует и на обычных, и на пещерных пауков)
spider-extra-speed-multiplier: 1.2

# ====== Железный голем ======
iron-golem-health-multiplier: 1.5
# Публичного атрибута "дальность удара" у мобов нет — см. пояснение в
# IronGolemListener.java. Это множитель дистанции, на которой голем всё ещё
# сможет ударить сверх обычной ближней дистанции (~1.7 блока)
iron-golem-attack-range-multiplier: 1.2
iron-golem-extra-hit-cooldown-ticks: 20
