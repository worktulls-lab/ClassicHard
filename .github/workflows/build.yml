name: Build with Maven

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - run: mvn -B package
        working-directory: tarkmullclassichard
      - uses: actions/upload-artifact@v4
        with:
          name: tarkmullclassichard-jar
          path: tarkmullclassichard/target/*.jar
